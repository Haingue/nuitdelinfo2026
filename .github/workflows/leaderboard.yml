name: TPS Challenge — Leaderboard

on:
  schedule:
    - cron: '*/15 * * * *' # toutes les 15 minutes
  workflow_dispatch: # déclenchement manuel pour les tests

# Un seul batch à la fois : les runs suivants attendent (ou sont annulés)
concurrency:
  group: leaderboard-batch
  cancel-in-progress: false

permissions:
  contents: write # commit des données leaderboard
  issues: read # scrape des inscriptions
  pages: write # déploiement GitHub Pages
  id-token: write

jobs:
  batch:
    name: 'Batch — calcul des scores'
    runs-on: ubuntu-latest
    timeout-minutes: 12 # garde-fou : laisse passer le créneau suivant
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Installer les dépendances
        run: pip install -r scoring/requirements.txt # requests

      - name: Exécuter le calculateur
        working-directory: scoring
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }} # PAT lecture publique (rate limit + élevé)
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # token SonarCloud lecture
          IDENTITY_SALT: ${{ secrets.IDENTITY_SALT }} # sel de l'empreinte d'identité
          WINDOW_START: ${{ vars.WINDOW_START }} # ouverture de la nuit (variable repo)
        run: python scoring.py --org votre-org --repo tpsc-challenge

      - name: Committer les données leaderboard
        run: |
          git config user.name "tpsc-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/leaderboard.json data/scores-history.json
          if git diff --cached --quiet; then
            echo "Aucun changement de score — pas de commit."
          else
            git commit -m "chore(leaderboard): mise à jour $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi

      - name: Upload des données pour le build
        uses: actions/upload-artifact@v4
        with:
          name: leaderboard-data
          path: data/

  pages:
    name: 'Build & déploiement SPA'
    needs: batch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: leaderboard/package-lock.json

      - name: Récupérer les données fraîches
        uses: actions/download-artifact@v4
        with:
          name: leaderboard-data
          path: leaderboard/public/data/

      - name: Build de la SPA React
        working-directory: leaderboard
        run: |
          npm ci
          npm run build          # Vite -> leaderboard/dist (public/data embarqué)

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: leaderboard/dist

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
