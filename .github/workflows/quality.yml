name: TPS Challenge — Usine Qualité

on:
  workflow_call:
    inputs:
      team-name:
        description: "Nom de l'équipe (doit correspondre à l'issue d'inscription)"
        required: true
        type: string
      identity-hash:
        description: "Empreinte d'identité fournie par Toyota à l'inscription"
        required: true
        type: string
      sonar-org:
        description: "Clé de l'organisation SonarCloud de l'équipe (déclarée à l'inscription)"
        required: true
        type: string
      # AUCUNE entrée technique : pas d'exclusions, pas de seuils, pas de chemins paramétrables.

permissions:
  contents: read
  issues: read
  # NOTE : un workflow réutilisable est plafonné par les permissions accordées
  # par le workflow APPELANT. Le fichier d'appel généré à l'inscription
  # accorde explicitement contents:read + issues:read — sans ce bloc côté équipe,
  # l'appel échoue sur les repos dont le GITHUB_TOKEN par défaut est restrictif.
  # Ne jamais élever ces permissions : ce workflow scanne du code étudiant.

env:
  CHALLENGE_REPO: Haingue/nuitdelinfo2026
  SONAR_HOST: https://sonarcloud.io

jobs:
  # ------------------------------------------------------------------
  # 1. Conformité : bloc d'appel identique au fichier généré à
  #    l'inscription + empreinte d'identité cohérente.
  # ------------------------------------------------------------------
  conformite:
    name: 'Jidoka — Contrôle de conformité'
    runs-on: ubuntu-latest
    # Les contrôles sont portés par le script conformite.py de l'image.
    container:
      image: ghcr.io/haingue/quality_factory:latest
    steps:
      - name: Contrôle de conformité (script Quality Factory)
        # conformite.py reproduit les contrôles historiques : fichier d'équipe,
        # empreinte d'identité + organisation SonarCloud, bloc d'appel identique
        # au bloc généré par Toyota, repository public.
        run: |
          python3 /quality_factory/conformite.py \
            --team-name "$TEAM_NAME" \
            --identity-hash "$IDENTITY_HASH" \
            --sonar-org "$SONAR_ORG_INPUT" \
            --challenge-repo "$CHALLENGE_REPO" \
            --repository "${{ github.repository }}" \
            --ref-name "${{ github.ref_name }}" \
            --workflow-ref "${{ github.workflow_ref }}"
        env:
          # Entrées d'équipe passées via l'environnement (pas d'interpolation shell).
          TEAM_NAME: ${{ inputs.team-name }}
          IDENTITY_HASH: ${{ inputs.identity-hash }}
          SONAR_ORG_INPUT: ${{ inputs.sonar-org }}
          GH_TOKEN: ${{ github.token }}

  # ------------------------------------------------------------------
  # 2. Scan SonarCloud — exclusions et seuils contrôlés par CE workflow.
  # ------------------------------------------------------------------
  sonar:
    name: 'Scan qualité SonarCloud'
    needs: [conformite, tests]
    if: always() && needs.conformite.result == 'success'
    runs-on: ubuntu-latest
    # Toute la mécanique Sonar (scanner, Quality Gate, export du rapport) est
    # portée par l'image Quality Factory et son script sonar.py.
    container:
      image: ghcr.io/haingue/quality_factory:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet pour la trajectoire Kaizen

      - name: Récupérer les rapports de couverture (tests)
        if: always()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-reports
          path: coverage-artifacts

      - name: Scan, Quality Gate et rapport (script Quality Factory)
        # sonar.py reproduit le job historique : vérification des rapports de
        # couverture, scan sonar-scanner (paramétrage imposé), Quality Gate
        # bloquant (Jidoka) puis export du rapport d'analyse SonarCloud.
        run: |
          python3 /quality_factory/sonar.py \
            --workspace "$GITHUB_WORKSPACE" \
            --repository "${{ github.repository }}" \
            --organization "$SONAR_ORG" \
            --host "$SONAR_HOST" \
            --branch "${{ github.ref_name }}" \
            --coverage-dir coverage-artifacts \
            --output sonar-analysis/report.json
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # token de l'équipe (cf. procédure de l'énoncé)
          # Organisation SonarCloud de l'ÉQUIPE : déclarée à l'inscription,
          # vérifiée contre le fichier d'équipe au step conformité
          # (ne peut être déduite du login GitHub : SonarCloud base la clé
          # sur le display name à l'import — ex. login "Haingue" -> org "FabienH")
          SONAR_ORG: ${{ inputs.sonar-org }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Télécharger le rapport d'analyse SonarCloud (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-analysis-report
          path: sonar-analysis/report.json
          if-no-files-found: error
          retention-days: 1

  tests:
    name: 'Tests — validation du projet'
    needs: conformite
    runs-on: ubuntu-latest
    # L'image Quality Factory embarque Java 21, Maven, Gradle, Node + pnpm et
    # Python : les steps setup-java / pnpm/action-setup ne sont plus nécessaires.
    container:
      image: ghcr.io/haingue/quality_factory:latest
    outputs:
      status: ${{ steps.run-tests.outputs.status }}
    steps:
      - uses: actions/checkout@v4

      - name: Détecter et exécuter les suites Java/Python/Node
        id: run-tests
        # tests.py (script Quality Factory) détecte les projets Java/Python/Node,
        # exécute les suites avec couverture et publie la sortie `status`.
        run: |
          python3 /quality_factory/tests.py \
            --workspace "$GITHUB_WORKSPACE" \
            --coverage-dir "$GITHUB_WORKSPACE/coverage-artifacts" \
            --results-file "$GITHUB_WORKSPACE/test-results.json" \
            --temp-dir "${RUNNER_TEMP:-/tmp}" \
            --verbose

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          # coverage-artifacts/{java,python,node} est produit directement par
          # tests.py au format attendu par le job sonar.
          path: coverage-artifacts/
          if-no-files-found: warn
          retention-days: 1

  # ------------------------------------------------------------------
  # 3. Supply chain — audit des dépendances (vulnérabilités critiques).
  # ------------------------------------------------------------------
  dependances:
    name: 'Supply chain — audit dépendances'
    needs: conformite
    runs-on: ubuntu-latest
    # L'image Quality Factory embarque JDK 21, Maven et Trivy pour le
    # script dependances.py.
    container:
      image: ghcr.io/haingue/quality_factory:latest
    outputs:
      critical: ${{ steps.metrics.outputs.critical }}
      high: ${{ steps.metrics.outputs.high }}
    steps:
      - uses: actions/checkout@v4

      - name: Audit supply chain (script Quality Factory)
        id: metrics
        # dependances.py pré-résout les dépendances Maven (non bloquant), lance
        # Trivy (vuln + secrets HIGH/CRITICAL) puis publie les sorties
        # critical/high et le résumé.
        run: |
          python3 /quality_factory/dependances.py \
            --workspace "$GITHUB_WORKSPACE" \
            --report "$GITHUB_WORKSPACE/trivy-report.json"

      - uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

  # ------------------------------------------------------------------
  # 4. Heijunka — régularité des commits sur la nuit.
  # ------------------------------------------------------------------
  rythme:
    name: 'Heijunka — régularité'
    needs: conformite
    runs-on: ubuntu-latest
    # git est fourni par l'image Quality Factory (script rythme.py).
    container:
      image: ghcr.io/haingue/quality_factory:latest
    outputs:
      commits: ${{ steps.metrics.outputs.commits }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Contrôle des commits et export de l'historique (script Quality Factory)
        id: metrics
        # rythme.py publie la sortie `commits` (avertit sous 20 commits) et
        # exporte artefact/commit-history.csv pour le batch leaderboard.
        run: |
          python3 /quality_factory/rythme.py --workspace "$GITHUB_WORKSPACE"

      - uses: actions/upload-artifact@v4
        with:
          name: heijunka-history
          path: artefact/commit-history.csv

  # ------------------------------------------------------------------
  # 5. Rapport — résumé visible dans la run (badge de conformité).
  # ------------------------------------------------------------------
  rapport:
    name: "Rapport d'usine"
    needs: [conformite, sonar, tests, dependances, rythme]
    if: always()
    runs-on: ubuntu-latest
    # La synthèse est portée par le script rapport.py de l'image.
    container:
      image: ghcr.io/haingue/quality_factory:latest
    steps:
      - name: Synthèse
        # rapport.py écrit le badge de conformité et le score officiel du
        # dernier batch dans le résumé de la run.
        env:
          TEAM_NAME: ${{ inputs.team-name }}
          TEAM_REPO: ${{ github.repository }}
          CONFORMITE: ${{ needs.conformite.result }}
          SONAR: ${{ needs.sonar.result }}
          TESTS: ${{ needs.tests.outputs.status }}
          CRIT_COUNT: ${{ needs.dependances.outputs.critical }}
          HIGH_COUNT: ${{ needs.dependances.outputs.high }}
          COMMIT_COUNT: ${{ needs.rythme.outputs.commits }}
        run: |
          python3 /quality_factory/rapport.py \
            --team-name "$TEAM_NAME" \
            --team-repo "$TEAM_REPO" \
            --challenge-repo "$CHALLENGE_REPO" \
            --conformite "$CONFORMITE" \
            --sonar "$SONAR" \
            --tests "$TESTS" \
            --critical "$CRIT_COUNT" \
            --high "$HIGH_COUNT" \
            --commits "$COMMIT_COUNT"
