name: TPS Challenge — Usine Qualité

on:
  workflow_call:
    inputs:
      team-name:
        description: "Nom de l'équipe (doit correspondre à l'issue d'inscription)"
        required: true
        type: string
      identity-hash:
        description: "Empreinte d'identité fournie par Toyota à l'inscription"
        required: true
        type: string
      sonar-org:
        description: "Clé de l'organisation SonarCloud de l'équipe (déclarée à l'inscription)"
        required: true
        type: string
      # AUCUNE entrée technique : pas d'exclusions, pas de seuils, pas de chemins paramétrables.

permissions:
  contents: read
  issues: read
  # NOTE : un workflow réutilisable est plafonné par les permissions accordées
  # par le workflow APPELANT. Le fichier d'appel généré à l'inscription
  # accorde explicitement contents:read + issues:read — sans ce bloc côté équipe,
  # l'appel échoue sur les repos dont le GITHUB_TOKEN par défaut est restrictif.
  # Ne jamais élever ces permissions : ce workflow scanne du code étudiant.

env:
  CHALLENGE_REPO: Haingue/nuitdelinfo2026
  SONAR_HOST: https://sonarcloud.io

jobs:
  # ------------------------------------------------------------------
  # 1. Conformité : bloc d'appel identique au fichier généré à
  #    l'inscription + empreinte d'identité cohérente.
  # ------------------------------------------------------------------
  conformite:
    name: 'Jidoka — Contrôle de conformité'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le fichier d'équipe (généré à l'inscription)
        run: |
          # slug identique à celui du workflow d'inscription :
          # minuscules, non-alnum -> tirets, tirets de bordure retirés
          SLUG=$(printf '%s' "${{ inputs.team-name }}" \
            | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-\n' '-' | sed 's/^-*//; s/-*$//')
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"

          curl -sfL "https://raw.githubusercontent.com/${CHALLENGE_REPO}/main/teams/${SLUG}.yml" -o /tmp/equipe.yml
          if [ ! -s /tmp/equipe.yml ]; then
            echo "::error::Aucun fichier d'inscription trouvé pour l'équipe '${{ inputs.team-name }}' (teams/${SLUG}.yml). Vérifiez votre inscription sur ${CHALLENGE_REPO}."
            exit 1
          fi

      - name: Vérifier l'empreinte d'identité et l'organisation SonarCloud
        run: |
          EXPECTED=$(sed -n 's/^identity-hash: *"\(.*\)"$/\1/p' /tmp/equipe.yml)
          if [ -z "$EXPECTED" ]; then
            echo "::error::Fichier d'équipe invalide (empreinte absente)."
            exit 1
          fi
          if [ "${{ inputs.identity-hash }}" != "$EXPECTED" ]; then
            echo "::error::Empreinte d'identité invalide pour cette équipe."
            exit 1
          fi
          # La clé d'org SonarCloud ne peut PAS être dérivée du login GitHub
          # (SonarCloud la base sur le display name à l'import) : elle est
          # déclarée à l'inscription et verrouillée ici comme l'empreinte.
          EXPECTED_ORG=$(sed -n 's/^sonar-org: *"\(.*\)"$/\1/p' /tmp/equipe.yml)
          if [ -z "$EXPECTED_ORG" ]; then
            echo "::error::Fichier d'équipe invalide (organisation SonarCloud absente)."
            exit 1
          fi
          if [ "${{ inputs.sonar-org }}" != "$EXPECTED_ORG" ]; then
            echo "::error::Clé d'organisation SonarCloud invalide pour cette équipe."
            exit 1
          fi
          echo "SONAR_ORG=$EXPECTED_ORG" >> "$GITHUB_ENV"
          echo "::notice::Empreinte d'identité + organisation SonarCloud conformes ✔"
          # NB : la validité cryptographique de l'empreinte
          # (SHA-256 de repository_id + team-name + SEL secret) est re-vérifiée
          # côté batch Toyota, où le sel est conservé.

      - name: Récupérer le fichier d'appel du repo de l'équipe
        run: |
          # github.workflow_ref = "owner/repo/.github/workflows/<fichier>@refs/heads/main"
          CALLER_FILE=$(echo "${{ github.workflow_ref }}" | sed 's|@.*$||' | xargs basename)
          echo "CALLER_FILE=$CALLER_FILE" >> "$GITHUB_ENV"
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/.github/workflows/${CALLER_FILE}" -o /tmp/caller.yml

      - name: Comparer les hash (bloc d'appel == bloc généré par Toyota)
        run: |
          # Le fichier d'équipe contient des métadonnées PUIS le bloc d'appel
          # délimité par les marqueurs "# === FICHIER D'APPEL" et "# === FIN DU FICHIER".
          # On extrait le bloc ENTRE les deux marqueurs (exclusifs) : c'est
          # exactement ce que l'équipe doit copier, byte pour byte.
          awk 'f && /^# === FIN DU FICHIER/{exit} f{print} /^# === FICHIER D.APPEL/{f=1}' /tmp/equipe.yml > /tmp/attendu.yml
          if [ ! -s /tmp/attendu.yml ]; then
            echo "::error::Bloc d'appel introuvable dans le fichier d'équipe — contactez les organisateurs."
            echo "--- Diagnostic : 30 premières lignes du fichier d'équipe ---"
            head -30 /tmp/equipe.yml
            echo "-----------------------------------------------------------"
            exit 1
          fi
          # NORMALISATION ANTI CRLF/LF : les éditeurs Windows produisent du
          # CRLF et des espaces de fin de ligne. On neutralise les deux
          # fichiers AVANT de hasher pour que seuls les caractères
          # SIGNIFICATIFS comptent :
          #   - suppression des \r (CRLF -> LF)
          #   - suppression des espaces/tabs de fin de ligne
          #   - suppression des lignes vides finales
          #   - un unique retour à la ligne final
          normalize() {
            awk '{ sub(/\r$/, ""); sub(/[ \t]+$/, ""); buf[NR] = $0 }
                 END { last = NR; while (last > 0 && buf[last] == "") last--;
                       for (i = 1; i <= last; i++) print buf[i] }'
          }
          normalize < /tmp/attendu.yml > /tmp/attendu-norm.yml
          normalize < /tmp/caller.yml    > /tmp/caller-norm.yml
          ATTENDU_SHA=$(sha256sum /tmp/attendu-norm.yml | cut -d' ' -f1)
          CALLER_SHA=$(sha256sum /tmp/caller-norm.yml | cut -d' ' -f1)
          if [ "$CALLER_SHA" != "$ATTENDU_SHA" ]; then
            echo "::error::Fichier d'appel non conforme au fichier généré lors de votre inscription. Restaurez-le sans le modifier."
            echo "--- Diagnostic : premières divergences (attendu vs copié) ---"
            diff /tmp/attendu-norm.yml /tmp/caller-norm.yml | head -20 || true
            echo "-----------------------------------------------------------"
            exit 1
          fi
          echo "::notice::Fichier d'appel conforme ✔"

      - name: Vérifier le repo public
        run: |
          VISIBILITY=$(gh repo view "${{ github.repository }}" --json visibility --jq .visibility)
          if [ "$VISIBILITY" != "PUBLIC" ]; then
            echo "::error::Le repository doit être public (requis pour l'évaluation)."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # ------------------------------------------------------------------
  # 2. Scan SonarCloud — exclusions et seuils contrôlés par CE workflow.
  # ------------------------------------------------------------------
  sonar:
    name: 'Scan qualité SonarCloud'
    needs: [conformite, tests]
    if: always() && needs.conformite.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet pour la trajectoire Kaizen

      - name: Récupérer les rapports de couverture Java
        if: always()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-reports
          path: coverage-artifacts

      - name: Vérifier les rapports de couverture disponibles
        run: |
          if find coverage-artifacts -type f \( -name '*.xml' -o -name 'lcov.info' \) -print -quit 2>/dev/null | grep -q .; then
            echo "Rapports de couverture téléchargés :"
            find coverage-artifacts -type f \( -name '*.xml' -o -name 'lcov.info' \) -print
          else
            echo "::warning::Aucun rapport de couverture disponible; SonarCloud affichera une couverture nulle."
          fi

      - name: Installer SonarScanner
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          curl -sfL "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.1.0.4477-linux-x64.zip" -o /tmp/scanner.zip
          unzip -q /tmp/scanner.zip -d /opt
          echo "/opt/sonar-scanner-6.1.0.4477-linux-x64/bin" >> "$GITHUB_PATH"

      - name: Scanner le projet (paramétrage imposé)
        run: |
          PROJECT_KEY=$(printf '%s' "${{ github.repository }}" | tr '/' '_')
          sonar-scanner \
            -Dsonar.projectKey="$PROJECT_KEY" \
            -Dsonar.organization="${SONAR_ORG}" \
            -Dsonar.host.url="$SONAR_HOST" \
            -Dsonar.sources=. \
            -Dsonar.exclusions="**/*.min.js,**/vendor/**,**/dist/**,**/node_modules/**,coverage-artifacts/**,**/dto/**,**/entity/**,**/model/**" \
            -Dsonar.coverage.exclusions="**/*.spec.*,**/tests/**,coverage-artifacts/**,**/dto/**,**/entity/**,**/model/**" \
            -Dsonar.coverage.jacoco.xmlReportPaths="coverage-artifacts/java/**/jacoco*.xml" \
            -Dsonar.python.coverage.reportPaths="coverage-artifacts/python/**/coverage.xml" \
            -Dsonar.javascript.lcov.reportPaths="coverage-artifacts/node/**/lcov.info" \
            -Dsonar.python.version=3.11
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # token de l'équipe (cf. procédure de l'énoncé)
          # Organisation SonarCloud de l'ÉQUIPE : déclarée à l'inscription,
          # vérifiée contre le fichier d'équipe au step conformité
          # (ne peut être déduite du login GitHub : SonarCloud base la clé
          # sur le display name à l'import — ex. login "Haingue" -> org "FabienH")
          SONAR_ORG: ${{ inputs.sonar-org }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Vérifier le Quality Gate (bloquant = Jidoka)
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        with:
          # report-task.txt généré par le scanner manuel ci-dessus
          scanMetadataReportFile: .scannerwork/report-task.txt
        # Ce job échoue si le gate est rouge -> run rouge visible côté équipe.
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Exporter le rapport d'analyse SonarCloud
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORG: ${{ inputs.sonar-org }}
          SONAR_HOST: ${{ env.SONAR_HOST }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p sonar-analysis
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          host = os.environ["SONAR_HOST"].rstrip("/")
          repository = os.environ["REPOSITORY"]
          branch = os.environ["BRANCH"]
          project_key = repository.replace("/", "_")
          token = os.environ.get("SONAR_TOKEN", "")
          report = {
            "project": project_key,
            "repository": repository,
            "organization": os.environ["SONAR_ORG"],
            "branch": branch,
            "dashboard_url": f"{host}/project/overview?id={project_key}&branch={branch}",
            "scan_metadata": {},
            "quality_gate": None,
            "measures": None,
            "issues": {"total": 0, "items": [], "truncated": False},
            "errors": [],
          }

          metadata_path = Path(".scannerwork/report-task.txt")
          if metadata_path.is_file():
            report["scan_metadata"] = {
              key.strip(): value.strip()
              for line in metadata_path.read_text(errors="replace").splitlines()
              if "=" in line
              for key, value in [line.split("=", 1)]
            }
          else:
            report["errors"].append("Scanner metadata not found; no completed upload was confirmed.")

          def get_json(endpoint, params):
            query = urlencode(params)
            request = Request(f"{host}/api/{endpoint}?{query}")
            credentials = base64.b64encode(f"{token}:".encode()).decode()
            request.add_header("Authorization", f"Basic {credentials}")
            with urlopen(request, timeout=30) as response:
              return json.load(response)

          if token and metadata_path.is_file():
            common = {"organization": os.environ["SONAR_ORG"], "branch": branch}
            for section, endpoint, params in (
              ("quality_gate", "qualitygates/project_status",
               {**common, "projectKey": project_key}),
              ("measures", "measures/component", {
                **common,
                "component": project_key,
                "metricKeys": ",".join((
                  "coverage", "duplicated_lines_density", "sqale_rating",
                  "sqale_index", "sqale_debt_ratio", "code_smells",
                  "security_rating", "reliability_rating", "bugs", "vulnerabilities",
                )),
              }),
            ):
              try:
                report[section] = get_json(endpoint, params)
              except (HTTPError, URLError, TimeoutError, ValueError) as error:
                report["errors"].append(f"{section}: {type(error).__name__}")

            try:
              page = 1
              page_size = 500
              while page <= 100:
                result = get_json("issues/search", {
                  **common,
                  "componentKeys": project_key,
                  "resolved": "false",
                  "ps": page_size,
                  "p": page,
                })
                items = result.get("issues", [])
                report["issues"]["total"] = result.get("total", len(items))
                report["issues"]["items"].extend(items)
                if not items or len(report["issues"]["items"]) >= report["issues"]["total"]:
                  break
                page += 1
              report["issues"]["truncated"] = (
                len(report["issues"]["items"]) < report["issues"]["total"]
              )
            except (HTTPError, URLError, TimeoutError, ValueError) as error:
              report["errors"].append(f"issues: {type(error).__name__}")
          elif not token:
            report["errors"].append("Sonar token unavailable to export step.")

          output = Path("sonar-analysis/report.json")
          output.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n")
          print(f"Rapport SonarCloud écrit: {output} ({len(report['issues']['items'])} issues exportées).")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
            summary.write("\n### Rapport détaillé SonarCloud\n\n")
            summary.write(f"Projet : [{project_key}]({report['dashboard_url']})\n\n")
            summary.write("Téléchargez l'artefact **sonar-analysis-report** de cette exécution pour consulter `report.json` (Quality Gate, mesures et issues).\n")
          PY

      - name: Télécharger le rapport d'analyse SonarCloud (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-analysis-report
          path: sonar-analysis/report.json
          if-no-files-found: error
          retention-days: 1

  tests:
    name: 'Tests — validation du projet'
    needs: conformite
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.run-tests.outputs.status }}
    steps:
      - uses: actions/checkout@v4

      - name: Installer Java pour les projets Maven/Gradle
        if: hashFiles('**/pom.xml', '**/build.gradle', '**/build.gradle.kts') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer pnpm compatible avec les lockfiles v9
        if: hashFiles('**/pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Détecter et exécuter les suites Java/Python/Node
        id: run-tests
        run: |
          set +e
          DETECTED=0
          FAILED=0
          FAILED_TESTS=0
          FRAMEWORKS=""
          SUITE_RESULTS='[]'

          record_suite() {
            LABEL="$1"
            RESULT="$2"
            DETECTED=$((DETECTED + 1))
            FRAMEWORKS="${FRAMEWORKS:+$FRAMEWORKS, }$LABEL"
            if [ "$RESULT" -ne 0 ]; then
              FAILED=$((FAILED + 1))
              SUITE_STATUS="failed"
              echo "::error title=Suite en échec::$LABEL (code de sortie $RESULT)"
            else
              SUITE_STATUS="passed"
              echo "::notice title=Suite réussie::$LABEL"
            fi
            SUITE_RESULTS=$(jq -c --arg name "$LABEL" --arg status "$SUITE_STATUS" \
              --argjson exit_code "$RESULT" '. + [{name: $name, status: $status, exit_code: $exit_code}]' \
              <<< "$SUITE_RESULTS")
          }

          PYTHON_PROJECTS=$(python3 - <<'PY'
          import os
          from pathlib import Path

          ignored = {'.git', 'node_modules', '.venv', 'venv', '__pycache__', 'build', 'dist'}
          markers = {'pyproject.toml', 'setup.py', 'setup.cfg', 'Pipfile', 'poetry.lock', 'uv.lock'}
          roots = set()
          for current, directories, files in os.walk('.'):
              directories[:] = [directory for directory in directories if directory not in ignored]
              tests = [name for name in files
                       if (name.startswith('test_') and name.endswith('.py'))
                       or name.endswith('_test.py')]
              if not tests:
                  continue
              test_directory = Path(current)
              root = Path('.')
              for candidate in (test_directory, *test_directory.parents):
                  candidate_files = {path.name for path in candidate.iterdir() if path.is_file()}
                  if markers.intersection(candidate_files) or any(
                      name.startswith('requirements') and name.endswith('.txt')
                      for name in candidate_files):
                      root = candidate
                      break
                  if candidate == Path('.'):
                      break
              roots.add(os.path.relpath(root, Path.cwd()))
          for root in sorted(roots):
              print(root)
          PY
          )

          while IFS= read -r PYTHON_DIR; do
            [ -n "$PYTHON_DIR" ] || continue
            PYTHON_PATH=${PYTHON_DIR#./}
            PYTHON_KEY=$(printf '%s' "${PYTHON_PATH:-root}" | tr '/ ' '__')
            PYTHON_COVERAGE_DIR="$GITHUB_WORKSPACE/coverage-artifacts/python/$PYTHON_KEY"
            (
              cd "$PYTHON_DIR" || exit 1
              INSTALL_RESULT=0
              while IFS= read -r REQUIREMENTS; do
                python -m pip install --disable-pip-version-check -r "$REQUIREMENTS" || INSTALL_RESULT=$?
              done < <(find . -maxdepth 1 -type f -name 'requirements*.txt' -print | sort)
              if [ "$INSTALL_RESULT" -eq 0 ]; then
                python -m pip install --disable-pip-version-check pytest pytest-cov || INSTALL_RESULT=$?
              fi
              if [ "$INSTALL_RESULT" -eq 0 ] && { [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ]; }; then
                python -m pip install --disable-pip-version-check -e . || INSTALL_RESULT=$?
              fi
              if [ "$INSTALL_RESULT" -eq 0 ]; then
                mkdir -p "$PYTHON_COVERAGE_DIR"
                python -m pytest -q --cov --cov-report=xml:"$PYTHON_COVERAGE_DIR/coverage.xml"
              else
                exit "$INSTALL_RESULT"
              fi
            )
            record_suite "Python (pytest $PYTHON_DIR)" "$?"
          done <<< "$PYTHON_PROJECTS"

          JAVA_PROJECTS=$(python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ignored = {'.git', 'node_modules', '.venv', 'venv', 'target', 'build'}
          pom_files = sorted(path for path in Path('.').rglob('pom.xml')
                             if not ignored.intersection(path.parts))
          pom_dirs = {path.parent.resolve() for path in pom_files}
          aggregated_modules = set()
          for pom in pom_files:
              try:
                  root = ET.parse(pom).getroot()
              except (ET.ParseError, OSError):
                  continue
              for element in root.iter():
                  if element.tag.rsplit('}', 1)[-1] == 'module' and element.text:
                      module_dir = (pom.parent / element.text.strip()).resolve()
                      if (module_dir / 'pom.xml').is_file():
                          aggregated_modules.add(module_dir)

          projects = []
          for pom_dir in sorted(pom_dirs):
              if pom_dir in aggregated_modules:
                  continue
              projects.append(('maven', pom_dir))

          settings_dirs = {path.parent.resolve() for path in Path('.').rglob('settings.gradle')}
          settings_dirs.update(path.parent.resolve() for path in Path('.').rglob('settings.gradle.kts'))
          gradle_build_dirs = {path.parent.resolve() for pattern in ('build.gradle', 'build.gradle.kts')
                               for path in Path('.').rglob(pattern)}
          for build_dir in sorted(gradle_build_dirs):
              if build_dir in pom_dirs:
                  continue
              if any(parent in settings_dirs for parent in build_dir.parents):
                  continue
              projects.append(('gradle', build_dir))

          def has_tests(directory):
              for path in directory.rglob('*'):
                  if not path.is_file() or ignored.intersection(path.parts):
                      continue
                  if any(other != directory and directory in other.parents and other in path.parents
                       for _, other in projects):
                      continue
                  relative_parts = path.relative_to(directory).parts
                  if any(relative_parts[index:index + 2] == ('src', 'test')
                         for index in range(len(relative_parts) - 1)):
                      return True
                  if path.name.endswith(('Test.java', 'Tests.java', 'Test.kt', 'Tests.kt')):
                      return True
              return False

          for kind, directory in projects:
              if not has_tests(directory):
                  continue
              relative = os.path.relpath(directory, Path.cwd())
              print(f'{kind}|{relative}')
          PY
          )

          if [ -n "$JAVA_PROJECTS" ]; then
            cat > "$RUNNER_TEMP/jacoco.init.gradle" <<'GRADLE'
          allprojects {
              apply plugin: 'jacoco'
              jacoco {
                  toolVersion = '0.8.14'
              }
              tasks.withType(Test).configureEach {
                  finalizedBy tasks.named('jacocoTestReport')
              }
              tasks.named('jacocoTestReport') {
                  reports {
                      xml.required = true
                  }
              }
          }
          GRADLE
          fi

          while IFS='|' read -r JAVA_KIND JAVA_DIR; do
            [ -n "$JAVA_KIND" ] || continue
            JAVA_RESULT=0

            if [ "$JAVA_KIND" = "maven" ]; then
              MAVEN_HAS_JACOCO=$(python3 - "$JAVA_DIR/pom.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          pom = ET.parse(sys.argv[1]).getroot()
          local_name = lambda element: element.tag.rsplit('}', 1)[-1]
          configured = False
          for build in pom:
              if local_name(build) != 'build':
                  continue
              for plugins in build:
                  if local_name(plugins) != 'plugins':
                      continue
                  for plugin in plugins:
                      if local_name(plugin) != 'plugin':
                          continue
                      artifact = next((child.text for child in plugin
                                       if local_name(child) == 'artifactId'), '')
                      if artifact != 'jacoco-maven-plugin':
                          continue
                      for execution in plugin.iter():
                          if local_name(execution) == 'goal' and execution.text == 'prepare-agent':
                              configured = True
          print('true' if configured else 'false')
          PY
          )
              if [ -f "$JAVA_DIR/mvnw" ]; then
                if [ "$MAVEN_HAS_JACOCO" = "true" ]; then
                  (cd "$JAVA_DIR" && bash ./mvnw -B -ntp verify)
                else
                  (cd "$JAVA_DIR" && bash ./mvnw -B -ntp org.jacoco:jacoco-maven-plugin:0.8.14:prepare-agent verify)
                fi
                JAVA_RESULT=$?
                (cd "$JAVA_DIR" && bash ./mvnw -B -ntp org.jacoco:jacoco-maven-plugin:0.8.14:report)
                REPORT_RESULT=$?
              elif command -v mvn >/dev/null 2>&1; then
                if [ "$MAVEN_HAS_JACOCO" = "true" ]; then
                  mvn -B -ntp -f "$JAVA_DIR/pom.xml" verify
                else
                  mvn -B -ntp -f "$JAVA_DIR/pom.xml" org.jacoco:jacoco-maven-plugin:0.8.14:prepare-agent verify
                fi
                JAVA_RESULT=$?
                mvn -B -ntp -f "$JAVA_DIR/pom.xml" org.jacoco:jacoco-maven-plugin:0.8.14:report
                REPORT_RESULT=$?
              else
                echo "::error::Maven détecté dans $JAVA_DIR mais mvn/mvnw est absent."
                JAVA_RESULT=1
                REPORT_RESULT=1
              fi
            else
              if [ -f "$JAVA_DIR/gradlew" ]; then
                (cd "$JAVA_DIR" && bash ./gradlew test --no-daemon --init-script "$RUNNER_TEMP/jacoco.init.gradle")
              else
                (cd "$JAVA_DIR" && gradle test --no-daemon --init-script "$RUNNER_TEMP/jacoco.init.gradle")
              fi
              JAVA_RESULT=$?
              REPORT_RESULT=0
            fi

            if [ "$REPORT_RESULT" -ne 0 ]; then JAVA_RESULT=1; fi
            JAVA_REPORT=$(JAVA_PROJECT_DIR="$JAVA_DIR" python3 - <<'PY'
          import glob
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          project_dir = Path(os.environ["JAVA_PROJECT_DIR"])
          patterns = (
              '**/target/surefire-reports/TEST-*.xml',
              '**/target/failsafe-reports/TEST-*.xml',
              '**/build/test-results/test/TEST-*.xml',
          )
          paths = sorted({path for pattern in patterns
                          for path in glob.glob(str(project_dir / pattern), recursive=True)})
          tests = failures = errors = 0
          for path in paths:
              try:
                  root = ET.parse(path).getroot()
                  tests += int(root.attrib.get('tests', 0))
                  failures += int(root.attrib.get('failures', 0))
                  errors += int(root.attrib.get('errors', 0))
              except (ET.ParseError, OSError, ValueError):
                  errors += 1
          print(json.dumps({'reports': len(paths), 'tests': tests,
                            'failures': failures, 'errors': errors}))
          PY
          )
            if [ "$?" -eq 0 ]; then
              JAVA_REPORTS=$(jq -r '.reports' <<< "$JAVA_REPORT")
              JAVA_FAILED_TESTS=$(jq -r '.failures + .errors' <<< "$JAVA_REPORT")
              FAILED_TESTS=$((FAILED_TESTS + JAVA_FAILED_TESTS))
              if [ "$JAVA_REPORTS" -eq 0 ] || [ "$JAVA_FAILED_TESTS" -gt 0 ]; then
                JAVA_RESULT=1
              fi
              echo "Java ($JAVA_DIR): $(jq -r '.tests' <<< "$JAVA_REPORT") tests, $JAVA_FAILED_TESTS échec(s), $JAVA_REPORTS rapport(s)."
            else
              JAVA_RESULT=1
            fi

            record_suite "Java ($JAVA_DIR)" "$JAVA_RESULT"
          done <<< "$JAVA_PROJECTS"

          while IFS= read -r -d '' PACKAGE; do
            if ! node -e 'process.exit(require(process.argv[1]).scripts?.test ? 0 : 1)' "$PWD/$PACKAGE"; then
              continue
            fi
            PACKAGE_DIR=$(dirname "$PACKAGE")
            PACKAGE_PATH=${PACKAGE_DIR#./}
            PACKAGE_KEY=$(printf '%s' "${PACKAGE_PATH:-root}" | tr '/ ' '__')
            COVERAGE_DIR="$GITHUB_WORKSPACE/coverage-artifacts/node/$PACKAGE_KEY"
            (
              cd "$PACKAGE_DIR" || exit 1
              if [ -f pnpm-lock.yaml ]; then
                pnpm install --frozen-lockfile
              elif [ -f yarn.lock ]; then
                corepack enable && yarn install --frozen-lockfile
              elif [ -f package-lock.json ]; then
                npm ci
              else
                npm install
              fi
              INSTALL_RESULT=$?
              if [ "$INSTALL_RESULT" -ne 0 ]; then exit "$INSTALL_RESULT"; fi

              if node -e 'try { require.resolve("vitest"); process.exit(0) } catch { process.exit(1) }'; then
                COVERAGE_PROVIDER=$(node -e 'for (const name of ["@vitest/coverage-v8", "@vitest/coverage-istanbul"]) { try { require.resolve(name); process.stdout.write(name.split("/").pop().replace("coverage-", "")); process.exit(0) } catch {} } process.exit(1)')
                if [ "$?" -eq 0 ]; then
                  mkdir -p "$COVERAGE_DIR"
                  if [ -f pnpm-lock.yaml ]; then
                    CI=true pnpm test -- --coverage --coverage.provider="$COVERAGE_PROVIDER" --coverage.reporter=lcov --coverage.reportOnFailure --coverage.reportsDirectory="$COVERAGE_DIR"
                  elif [ -f yarn.lock ]; then
                    CI=true yarn test --coverage --coverage.provider="$COVERAGE_PROVIDER" --coverage.reporter=lcov --coverage.reportOnFailure --coverage.reportsDirectory="$COVERAGE_DIR"
                  else
                    CI=true npm test -- --coverage --coverage.provider="$COVERAGE_PROVIDER" --coverage.reporter=lcov --coverage.reportOnFailure --coverage.reportsDirectory="$COVERAGE_DIR"
                  fi
                else
                  echo "::warning::Vitest détecté dans $PACKAGE_DIR, mais aucun provider @vitest/coverage-v8 ou @vitest/coverage-istanbul n'est installé. Ajoutez @vitest/coverage-v8 à vos devDependencies pour publier la couverture Sonar."
                  if [ -f pnpm-lock.yaml ]; then
                    CI=true pnpm test
                  elif [ -f yarn.lock ]; then
                    CI=true yarn test
                  else
                    CI=true npm test
                  fi
                fi
              else
                if [ -f pnpm-lock.yaml ]; then
                  CI=true pnpm test
                elif [ -f yarn.lock ]; then
                  CI=true yarn test
                else
                  CI=true npm test
                fi
              fi
            )
            record_suite "Node ($(dirname "$PACKAGE"))" "$?"
          done < <(find . -type d \( -name .git -o -name node_modules -o -name .venv -o -name venv \) -prune -o \
            -type f -name package.json -print0)

          if [ "$DETECTED" -eq 0 ]; then
            STATUS="not_found"
            echo "::warning::Aucune suite Java, Python ou Node détectée."
          elif [ "$FAILED" -gt 0 ]; then
            STATUS="failed"
            echo "::error::$FAILED suite(s) de tests en échec sur $DETECTED."
          else
            STATUS="passed"
            echo "::notice::$DETECTED suite(s) de tests réussie(s)."
          fi

          jq -n --arg status "$STATUS" --argjson detected "$DETECTED" \
            --argjson failed "$FAILED" --argjson failed_tests "$FAILED_TESTS" \
            --arg frameworks "$FRAMEWORKS" \
            --argjson suites "$SUITE_RESULTS" \
            '{status: $status, detected: $detected, failed: $failed, failed_tests: $failed_tests, frameworks: $frameworks, suites: $suites}' \
            > test-results.json
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" = "failed" ]; then exit 1; fi

      - name: Préparer les rapports de couverture pour Sonar
        if: always()
        run: |
          mkdir -p sonar-coverage/java sonar-coverage/python sonar-coverage/node
          while IFS= read -r -d '' REPORT; do
            RELATIVE=${REPORT#./}
            mkdir -p "sonar-coverage/java/$(dirname "$RELATIVE")"
            cp "$REPORT" "sonar-coverage/java/$RELATIVE"
          done < <(find . -type d \( -name .git -o -name node_modules -o -name .venv -o -name venv \) -prune -o \
            -type f \( -path '*/target/site/jacoco/jacoco.xml' -o -path '*/build/reports/jacoco/test/jacocoTestReport.xml' \) -print0)
          if [ -d coverage-artifacts/python ]; then
            cp -R coverage-artifacts/python/. sonar-coverage/python/
          fi
          if [ -d coverage-artifacts/node ]; then
            cp -R coverage-artifacts/node/. sonar-coverage/node/
          fi
          echo "Rapports préparés pour Sonar :"
          find sonar-coverage -type f -print

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: sonar-coverage/
          if-no-files-found: warn
          retention-days: 1

  # ------------------------------------------------------------------
  # 3. Supply chain — audit des dépendances (vulnérabilités critiques).
  # ------------------------------------------------------------------
  dependances:
    name: 'Supply chain — audit dépendances'
    needs: conformite
    runs-on: ubuntu-latest
    outputs:
      critical: ${{ steps.metrics.outputs.critical }}
      high: ${{ steps.metrics.outputs.high }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Java pour résoudre les dépendances Maven
        if: hashFiles('**/pom.xml') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Pré-résoudre le modèle et les dépendances Maven
        if: hashFiles('**/pom.xml') != ''
        continue-on-error: true
        run: |
          POM=$(find . -type d \( -name .git -o -name target -o -name node_modules \) -prune -o \
            -type f -name pom.xml -print -quit)
          PROJECT_DIR=$(dirname "$POM")
          cd "$PROJECT_DIR"
          if [ -f mvnw ]; then
            bash ./mvnw -B -ntp org.apache.maven.plugins:maven-dependency-plugin:3.8.1:go-offline -DskipTests
          else
            if ! command -v mvn >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y maven
            fi
            mvn -B -ntp -f pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.8.1:go-offline -DskipTests
          fi

      - name: Trivy (toutes les vulnérabilités HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          format: json
          output: trivy-report.json
          exit-code: '0'

      - name: Extraire les métriques supply chain
        id: metrics
        run: |
          if [ ! -s trivy-report.json ] || ! jq -e 'type == "object" and (.Results | type == "array")' trivy-report.json >/dev/null; then
            echo "::error::Rapport Trivy absent ou invalide; impossible de confirmer l'état des dépendances."
            exit 1
          fi
          CRIT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-report.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-report.json)
          PACKAGES=$(jq '[.Results[]?.Packages[]?] | length' trivy-report.json)
          UNRESOLVED=$(jq '[.Results[]? | select(.Class=="lang-pkgs") | .Packages[]? | select((.Version // "") == "")] | length' trivy-report.json)
          TARGETS=$(jq '[.Results[]?.Target] | unique | join(", ")' trivy-report.json)
          SECRETS=$(jq '[.Results[]?.Secrets[]?] | length' trivy-report.json)
          echo "critical=$CRIT" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH" >> "$GITHUB_OUTPUT"
          echo "::notice::Trivy: CRIT=$CRIT HIGH=$HIGH, paquets=$PACKAGES, versions non résolues=$UNRESOLVED, secrets=$SECRETS; cibles=$TARGETS"
          if [ "$UNRESOLVED" -gt 0 ]; then
            echo "::warning::$UNRESOLVED dépendance(s) sans version; leurs dépendances transitives ne sont pas couvertes. Le scoring supply chain les traite comme un scan incomplet."
          fi
          {
            echo "### Résultat Trivy"
            echo "- Cibles analysées : ${TARGETS:-aucune déclarée}"
            echo "- Paquets inventoriés : $PACKAGES"
            echo "- Vulnérabilités HIGH/CRITICAL : $HIGH/$CRIT"
            echo "- Versions manquantes : $UNRESOLVED"
            echo "- Secrets détectés : $SECRETS"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

  # ------------------------------------------------------------------
  # 4. Heijunka — régularité des commits sur la nuit.
  # ------------------------------------------------------------------
  rythme:
    name: 'Heijunka — régularité'
    needs: conformite
    runs-on: ubuntu-latest
    outputs:
      commits: ${{ steps.metrics.outputs.commits }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Contrôle du nombre minimum de commits
        id: metrics
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "commits=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -lt 20 ]; then
            echo "::warning::Seulement $COUNT commits — minimum 20 requis pour être classé (trajectoire Kaizen)."
          fi

      - name: Exporter l'historique horodaté
        run: |
          git log --pretty=format:'%H;%aI;%s' > commit-history.csv
          # Le calcul d'entropie horaire est fait côté batch (leaderboard), pas en CI :
          # on archive juste les données brutes.
          mkdir -p artefact
          cp commit-history.csv artefact/

      - uses: actions/upload-artifact@v4
        with:
          name: heijunka-history
          path: artefact/commit-history.csv

  # ------------------------------------------------------------------
  # 5. Rapport — résumé visible dans la run (badge de conformité).
  # ------------------------------------------------------------------
  rapport:
    name: "Rapport d'usine"
    needs: [conformite, sonar, tests, dependances, rythme]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Synthèse
        env:
          TEAM_NAME: ${{ inputs.team-name }}
          TEAM_REPO: ${{ github.repository }}
          CONFORMITE: ${{ needs.conformite.result }}
          SONAR: ${{ needs.sonar.result }}
          TESTS: ${{ needs.tests.outputs.status }}
          CRIT_COUNT: ${{ needs.dependances.outputs.critical }}
          HIGH_COUNT: ${{ needs.dependances.outputs.high }}
          COMMIT_COUNT: ${{ needs.rythme.outputs.commits }}
        run: |
          {
          echo "### 🏭 Rapport d'usine — ${TEAM_NAME}"
          echo ""
          echo "| Contrôle | Statut |"
          echo "|---|---|"
          echo "| Conformité & identité | ${CONFORMITE} |"
          echo "| Quality Gate SonarCloud | ${SONAR} |"
          echo "| Tests détectés | ${TESTS:-indisponible} |"
          echo "| Vulnérabilités CRITICAL/HIGH détectées | ${CRIT_COUNT:-indisponible}/${HIGH_COUNT:-indisponible} |"
          echo "| Commits du dépôt (toutes dates) | ${COMMIT_COUNT:-indisponible} |"
          echo ""
          echo "Les versions non résolues par Trivy ne permettent pas de conclure à l'absence de vulnérabilités. Le seuil de 20 commits pour le classement porte sur la fenêtre du défi."
          echo ""
          echo "### Score officiel du dernier batch"
          echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if curl -sfL --connect-timeout 10 --max-time 30 \
              "https://raw.githubusercontent.com/${CHALLENGE_REPO}/main/data/leaderboard.json" \
              -o /tmp/leaderboard.json \
              && jq -e --arg repo "$TEAM_REPO" \
                'if type == "array" then [.[] | select(.repo == $repo and (.score | type == "number"))][0] // empty else empty end' \
                /tmp/leaderboard.json > /tmp/score-equipe.json; then
            jq -r '
              "**Score : \(.score) points** · Rang : \(.rank // "indisponible")",
              "",
              "Classement : \(if .eligible then "éligible" else "non éligible" end)",
              "",
              "Dernière mise à jour : \(.timestamp // "indisponible")",
              "",
              "| Composante | Points |",
              "|---|---:|",
              "| Qualité | \(.breakdown.qualite // 0) / 60 |",
              "| Progression Kaizen | \(.breakdown.pente // 0) / 20 |",
              "| Résilience | \(.breakdown.resilience // 0) / 10 |",
              "| Régularité Heijunka | \(.breakdown.heijunka // 0) / 10 |",
              "| Bonus / malus | \(.breakdown.bonus_malus // 0) |"
            ' /tmp/score-equipe.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Score indisponible : aucun score publié pour ce dépôt ou données temporairement inaccessibles." >> "$GITHUB_STEP_SUMMARY"
          fi
          {
          echo ""
          echo "Le batch est planifié toutes les 15 minutes. Ce score peut ne pas encore inclure cette exécution."
          echo ""
          echo "[Suivre les mises à jour du classement](https://haingue.github.io/nuitdelinfo2026/)"
          } >> "$GITHUB_STEP_SUMMARY"
