name: 🏭 Inscription au TPS Challenge
description: Inscrivez votre équipe pour participer au défi Toyota
labels: ["inscription"]
title: "Inscription — [nom de votre équipe]"
body:
  - type: markdown
    attributes:
      value: |
        ## Bienvenue au TPS Challenge ! 🏭

        Avant de vous inscrire, vérifiez que votre repository est **public**.

        Après validation, notre bot vous répondra dans cette issue avec votre
        fichier d'appel **personnalisé** (team-name + empreinte d'identité).
  - type: input
    id: team-name
    attributes:
      label: Nom de votre équipe
      description: Unique — c'est lui qui apparaîtra sur le leaderboard
      placeholder: "Les Kaizen Warriors"
    validations:
      required: true
  - type: input
    id: repo-url
    attributes:
      label: URL de votre repository GitHub public
      placeholder: "https://github.com/mon-equipe/mon-projet"
    validations:
      required: true
  - type: input
    id: sonar-org
    attributes:
      label: Clé de votre organisation SonarCloud
      description: >-
        Créez-la d'abord sur sonarcloud.io via « Import repository from GitHub »
        (faites-le avec le compte PROPRIÉTAIRE du repo). La clé apparaît dans
        l'URL : sonarcloud.io/VOTRE-CLE. ⚠️ Ce n'est PAS forcément votre login GitHub.
      placeholder: "ex : FabienH (pas votre login GitHub si votre display name diffère)"
    validations:
      required: true
  - type: checkboxes
    id: reglement
    attributes:
      label: Engagement
      options:
        - label: Notre repository est public et nous acceptons le règlement du défi
          required: true